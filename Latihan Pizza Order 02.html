<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kita nyoba bikin form pemesanan Pizza</title>
  
</head>

<body>
  <h1>Black Ghoese bistro | Pizza on-Demand</h1>
  <p>Our 12&quest; wood-fired Pizzas are available for deliverry.</p>

  <Form action="http://www.blackgoosebistro.com/pizza.php" method="post">
   <fieldset>
    
  <legend>Your information</legend>

  <table>
   </tr>
    <tr>
      <td><label for="Name">Name:</label></td>
      <td><input type="text" id="Name" name="Name"></td>
    </tr>
    <tr>
      <td><label for="address">Address:</label></td>
      <td><input type="text" id="address" name="address"></td>
    </tr>
    <tr>
      <td><label for="phone">Phone:</label></td>
      <td><input type="tel" id="phone" name="phone"></td>
    </tr>
    <tr>
      <td><label for="email">Email:</label></td>
      <td><input type="email" id="email" name="email"></td>
    </tr>
    <tr>
      <td valign="top"><label for="intructions">Delivery:</label></td>
      <td>
        <textarea id="intructions" name="intructions" rows="4" cols="50"
          maxlength="400" placeholder="no more than 400 characters."></textarea>
      </td>
    </tr>
  </table>
</fieldset>
    <fieldset>
      <p>
        <legend>Design your dream Pizza</legend>
      <p>
      <p>Pizza Specs</p>
      <p>Pilih 1: </p>

      <p>
        <input type="radio" id="classic" name="crust" value="classic white">
        <label for="classic">Classic White</label><br>

        <input type="radio" id="multigrain" name="crust" value="multigrain">
        <label for="multigrain">Multigrain</label><br>

        <input type="radio" id="cheese" name="crust" value="cheese">
        <label for="cheese">Cheese</label><br>

        <input type="radio" id="gluten" name="crust" value="gluten">
        <label for="classic">Gluten</label><br>
      <p>
      <p>Toppings</p>
      <p>
        <input type="checkbox" id="cheese" name="topping" value="Cheese">
        <label for="cheese">Cheese</label><br>

        <input type="checkbox" id="redsauce" name="topping" value="Cheese">
        <label for="redsauce">Redsauce</label><br>

        <input type="checkbox" id="mayonaise" name="topping" value="Cheese">
        <label for="mayonaise">Mayonaise</label><br>

        <input type="checkbox" id="mushrom" name="topping" value="Cheese">
        <label for="mushrom">Mushrom</label><br>

        <input type="checkbox" id="chicken" name="topping" value="Cheese">
        <label for="chicken">Chicken</label><br>

        <input type="checkbox" id="beef" name="topping" value="Cheese">
        <label for="beef">Beef</label><br>

        <input type="checkbox" id="tuna" name="topping" value="Cheese">
        <label for="tuna">Tuna</label><br>
      </p>

      <p>
        <label for="quantity">Quantity: </label>
        <input type="number" id="quantity" name="quantity" min="1" max="10">
      </p>

      <p>
      <label for="payment">Metode Pembayaran: </label>
      <select id="payment" name="payment" required>
        <option value="">-- Pilih --</option>
        <option value="cash">Cash</option>
        <option value="qris">QRIS</option>
        <option value="transfer">Transfer</option>
      </select>
    </p>
    </fieldset>

    <p>
      <input type="submit" value="submit">
      <input type="reset" value="reset">
    </p>

  </Form>

</body>

</html>
